<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Emoções FM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #111827;
            --accent-blue: #38bdf8;
            --accent-pink: #f43f5e;
            --text-light: #f1f5f9;
            --text-gray: #94a3b8;
            --border-color: #1f2937;
        }

        .light-theme {
            --bg-dark: #f1f5f9;
            --card-bg: #ffffff;
            --accent-blue: #0284c7;
            --accent-pink: #e11d48;
            --text-light: #0f172a;
            --text-gray: #64748b;
            --border-color: #cbd5e1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-area { display: flex; align-items: center; gap: 14px; }
        .logo-img-box {
            width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: #1e293b;
            display: flex; justify-content: center; align-items: center; border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .logo-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .logo-img-box i { font-size: 1.8rem; color: var(--accent-pink); }

        .logo-text h1 { font-size: 1.5rem; color: var(--accent-blue); letter-spacing: 0.5px; }
        .logo-text p { font-size: 0.8rem; color: var(--text-gray); }

        .header-controls { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }

        .theme-toggle {
            background: var(--border-color); color: var(--text-light); border: none; padding: 8px 12px;
            border-radius: 20px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; font-weight: bold;
        }
        .theme-toggle:hover { opacity: 0.8; }

        .badge-ao-vivo {
            background: rgba(244, 63, 94, 0.15); color: var(--accent-pink); padding: 6px 14px;
            border-radius: 20px; font-size: 0.85rem; font-weight: bold; display: flex; align-items: center;
            gap: 8px; border: 1px solid rgba(244, 63, 94, 0.3);
        }
        .badge-ao-vivo span {
            width: 8px; height: 8px; background: var(--accent-pink); border-radius: 50%;
            display: inline-block; box-shadow: 0 0 8px var(--accent-pink); animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        .container {
            max-width: 1200px; margin: 2rem auto; padding: 0 1rem;
            display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; flex: 1; width: 100%;
        }

        .main-column { display: flex; flex-direction: column; gap: 2rem; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }

        .video-container {
            position: relative; width: 100%; height: 380px; background: #000;
            border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center; color: var(--text-gray);
        }
        .video-container iframe { width: 100%; height: 100%; border: none; }
        .video-placeholder { text-align: center; }
        .video-placeholder i { font-size: 3rem; color: var(--accent-blue); margin-bottom: 0.8rem; }

        .news-wrapper { display: flex; flex-direction: column; gap: 1.5rem; }
        .news-card h2 { font-size: 1.3rem; color: var(--accent-blue); margin-bottom: 0.6rem; }
        .news-card p { color: var(--text-gray); line-height: 1.6; font-size: 0.95rem; word-break: break-word; }

        .sidebar { display: flex; flex-direction: column; gap: 1.5rem; }
        .ad-box {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px;
            height: 200px; display: flex; justify-content: center; align-items: center; color: var(--text-gray);
            overflow: hidden; position: relative; text-align: center; font-size: 0.85rem;
        }
        .ad-box img { width: 100%; height: 100%; object-fit: contain; }

        .interactive-card h3 { font-size: 1.1rem; color: var(--accent-blue); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .form-group input, .form-group textarea {
            background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-light);
            padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; width: 100%;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent-blue); }
        .btn-enviar {
            background: var(--accent-blue); color: white; border: none; padding: 8px 15px;
            border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
        }
        .btn-enviar:hover { opacity: 0.9; }

        .chat-messages {
            background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 6px;
            height: 160px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; margin-bottom: 10px;
        }
        .chat-msg { background: var(--card-bg); padding: 6px 10px; border-radius: 6px; border-left: 3px solid var(--accent-pink); word-break: break-word; }
        .chat-msg b { color: var(--accent-blue); font-size: 0.8rem; display: block; }

        footer {
            background: var(--card-bg); border-top: 1px solid var(--border-color); padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center; position: sticky; bottom: 0; z-index: 100; flex-wrap: wrap; gap: 1rem;
        }
        .player-info { display: flex; align-items: center; gap: 12px; }
        .player-info i { font-size: 1.8rem; color: var(--accent-pink); }
        .player-info h4 { font-size: 1rem; color: var(--text-light); }
        .player-info p { font-size: 0.8rem; color: var(--text-gray); }

        .cstrEmbed a { font-size: 0.7rem; color: var(--text-gray); text-decoration: none; margin-right: 5px; opacity: 0.6; }
        .cstrEmbed a:hover { opacity: 1; }

        @media (max-width: 900px) { 
            .container { grid-template-columns: 1fr; } 
            header, footer { flex-direction: column; align-items: flex-start; }
            .header-controls { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body id="body-root">

    <header>
        <div class="logo-area">
            <div class="logo-img-box" id="header-logo-container">
                <i class="fas fa-broadcast-tower"></i>
            </div>
            <div class="logo-text">
                <h1 id="header-nome">Emoções FM</h1>
                <p id="header-slogan">A Rádio Que Toca O Seu Coração</p>
            </div>
        </div>
        <div class="header-controls">
            <button class="theme-toggle" onclick="alternarTema()">
                <i class="fas fa-moon" id="theme-icon"></i> <span id="theme-text">Modo Escuro</span>
            </button>
            <div class="badge-ao-vivo">
                <span></span> TRANSMISSÃO AO VIVO
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-column">
            <div class="card">
                <div class="video-container" id="video-area">
                    <div class="video-placeholder">
                        <i class="fas fa-video-slash"></i>
                        <p>Aguardando transmissão ao vivo...</p>
                    </div>
                </div>
            </div>
            <div class="news-wrapper" id="display-noticias"></div>
        </div>

        <div class="sidebar">
            <div class="card interactive-card">
                <h3><i class="fas fa-compact-disc"></i> Pedido Musical</h3>
                <div class="form-group">
                    <input type="text" id="input-pedido-nome" placeholder="Seu Nome">
                    <input type="text" id="input-pedido-musica" placeholder="Nome da Música / Cantor">
                </div>
                <button class="btn-enviar" onclick="enviarPedido()"><i class="fas fa-paper-plane"></i> Enviar Pedido</button>
            </div>

            <div class="card interactive-card">
                <h3><i class="fas fa-comments"></i> Chat com Ouvintes</h3>
                <div class="chat-messages" id="chat-container"></div>
                <div class="form-group" style="margin-bottom: 0;">
                    <input type="text" id="input-chat-nome" placeholder="Seu Apelido" style="margin-bottom: 6px;">
                    <textarea id="input-chat-texto" placeholder="Escreva sua mensagem..." style="height: 50px; resize: none;"></textarea>
                </div>
                <button class="btn-enviar" style="margin-top: 8px;" onclick="enviarMensagemChat()"><i class="fas fa-paper-plane"></i> Enviar no Chat</button>
            </div>

            <div id="sidebar-ads" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div class="ad-box">
                    <span>Espaço Patrocinador</span>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="player-info">
            <i class="fas fa-music"></i>
            <div>
                <h4>Áudio Ao Vivo 24h</h4>
                <p id="audio-status-text">Transmitindo via Caster.fm</p>
            </div>
        </div>

        <div id="footer-player-wrapper">
            <div data-type="newStreamPlayer" data-publicToken="41220103-d8e6-4da3-b9ed-e61182f127ef" data-theme="light" data-color="e81e4d" data-channelId="" data-rendered="false" class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a> 
                <a href="https://www.caster.fm">Stream Hosting</a> 
                <a href="https://www.caster.fm">Stream Hosting</a>
            </div>
        </div>
    </footer>

    <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>

    <script>
        // Configuração do Supabase
        const SUPABASE_URL = "https://gyqsdyfmhzkvwxkxnlv.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_DrwmU-nMvgmJ8GsTeckqig_hgIB6ZRL";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', async () => {
            await carregarDadosSupabase();
            carregarChatOuvinte();
            setInterval(carregarDadosSupabase, 3000); // Sincroniza dados e player em tempo real
            setInterval(carregarChatOuvinte, 3000);
        });

        async function carregarDadosSupabase() {
            const { data, error } = await supabaseClient.from('config_radio').select('*');
            if (error) return;

            if (data) {
                data.forEach(item => {
                    if (item.chave === 'radioNome') {
                        document.getElementById('header-nome').innerText = item.valor;
                        document.getElementById('page-title').innerText = item.valor;
                    }
                    if (item.chave === 'radioSlogan') {
                        document.getElementById('header-slogan').innerText = item.valor;
                    }
                    if (item.chave === 'radioLogo' && item.valor && item.valor.trim() !== "") {
                        const logoBox = document.getElementById('header-logo-container');
                        logoBox.innerHTML = `<img src="${item.valor.trim()}" alt="Logo" onerror="this.onerror=null;this.parentNode.innerHTML='<i class=\'fas fa-broadcast-tower\'></i>';">`;
                    }
                    
                    // Estado do Vídeo YouTube (Ativo / Pausado)
                    if (item.chave === 'estadoVideo') {
                        const videoArea = document.getElementById('video-area');
                        if (item.valor === 'ativo') {
                            videoArea.innerHTML = `<iframe src="https://www.youtube.com/embed/live_stream?channel=UC_SEU_CANAL_AQUI&autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                        } else {
                            videoArea.innerHTML = `<div class="video-placeholder"><i class="fas fa-video-slash"></i><p>Transmissão de vídeo pausada pelo operador.</p></div>`;
                        }
                    }

                    // Estado do Áudio Caster.fm (Transmitindo / Pausado)
                    if (item.chave === 'estadoAudio') {
                        const audioStatus = document.getElementById('audio-status-text');
                        const playerWrapper = document.getElementById('footer-player-wrapper');
                        if (item.valor === 'pausado') {
                            audioStatus.innerText = "Transmissão pausada pelo operador";
                            playerWrapper.style.display = 'none';
                        } else {
                            audioStatus.innerText = "Transmitindo via Caster.fm";
                            playerWrapper.style.display = 'block';
                        }
                    }

                    if (item.chave === 'listaNoticias') {
                        try {
                            const noticiasSalvas = JSON.parse(item.valor) || [];
                            const containerNoticias = document.getElementById('display-noticias');
                            containerNoticias.innerHTML = '';
                            if (noticiasSalvas.length > 0) {
                                noticiasSalvas.forEach(n => {
                                    const card = document.createElement('div');
                                    card.className = 'card news-card';
                                    card.innerHTML = `<h2>${n.titulo}</h2><p>${n.texto}</p>`;
                                    containerNoticias.appendChild(card);
                                });
                            } else {
                                containerNoticias.innerHTML = `<div class="card news-card"><h2>Bem-vindo</h2><p>Fique ligado na programação.</p></div>`;
                            }
                        } catch(e) {}
                    }
                    if (item.chave === 'listaAds') {
                        try {
                            const adsSalvos = JSON.parse(item.valor) || [];
                            const sidebarAds = document.getElementById('sidebar-ads');
                            sidebarAds.innerHTML = '';
                            if (adsSalvos.length > 0) {
                                adsSalvos.forEach(imgSrc => {
                                    const box = document.createElement('div');
                                    box.className = 'ad-box';
                                    box.innerHTML = `<img src="${imgSrc.trim()}" alt="Patrocinador" onerror="this.onerror=null;this.parentNode.innerHTML='<span>Espaço Patrocinador</span>';">`;
                                    sidebarAds.appendChild(box);
                                });
                            } else {
                                sidebarAds.innerHTML = `<div class="ad-box"><span>Espaço Patrocinador</span></div>`;
                            }
                        } catch(e) {}
                    }
                });
            }
        }

        async function salvarChaveNoSupabase(chave, valorString) {
            const { data } = await supabaseClient.from('config_radio').select('*').eq('chave', chave);
            if (data && data.length > 0) {
                await supabaseClient.from('config_radio').update({ valor: valorString }).eq('chave', chave);
            } else {
                await supabaseClient.from('config_radio').insert([{ chave: chave, valor: valorString }]);
            }
        }

        function alternarTema() {
            const body = document.getElementById('body-root');
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            body.classList.toggle('light-theme');

            if (body.classList.contains('light-theme')) {
                icon.className = 'fas fa-sun';
                text.innerText = 'Modo Claro';
                localStorage.setItem('radioTema', 'light');
            } else {
                icon.className = 'fas fa-moon';
                text.innerText = 'Modo Escuro';
                localStorage.setItem('radioTema', 'dark');
            }
        }

        if (localStorage.getItem('radioTema') === 'light') {
            document.getElementById('body-root').classList.add('light-theme');
            document.getElementById('theme-icon').className = 'fas fa-sun';
            document.getElementById('theme-text').innerText = 'Modo Claro';
        }

        async function enviarPedido() {
            const nome = document.getElementById('input-pedido-nome').value.trim();
            const musica = document.getElementById('input-pedido-musica').value.trim();
            if (!nome || !musica) {
                alert('Preencha seu nome e o nome da música!');
                return;
            }

            const { data } = await supabaseClient.from('config_radio').select('*').eq('chave', 'listaPedidos');
            let pedidos = [];
            if (data && data.length > 0) {
                try { pedidos = JSON.parse(data[0].valor) || []; } catch(e) {}
            }
            pedidos.push({ nome, musica });
            
            await salvarChaveNoSupabase('listaPedidos', JSON.stringify(pedidos));
            document.getElementById('input-pedido-musica').value = '';
            alert('Pedido enviado com sucesso para o operador!');
        }

        async function enviarMensagemChat() {
            const nome = document.getElementById('input-chat-nome').value.trim();
            const texto = document.getElementById('input-chat-texto').value.trim();
            if (!nome || !texto) {
                alert('Preencha seu apelido e a mensagem!');
                return;
            }

            const { data } = await supabaseClient.from('config_radio').select('*').eq('chave', 'listaChat');
            let chat = [];
            if (data && data.length > 0) {
                try { chat = JSON.parse(data[0].valor) || []; } catch(e) {}
            }
            chat.push({ nome, texto });

            await salvarChaveNoSupabase('listaChat', JSON.stringify(chat));
            document.getElementById('input-chat-texto').value = '';
            carregarChatOuvinte();
        }

        async function carregarChatOuvinte() {
            const { data } = await supabaseClient.from('config_radio').select('*').eq('chave', 'listaChat');
            let chat = [];
            if (data && data.length > 0) {
                try { chat = JSON.parse(data[0].valor) || []; } catch(e) {}
            }

            const container = document.getElementById('chat-container');
            if (chat.length === 0) {
                container.innerHTML = `<span style="color: var(--text-gray); text-align:center; font-size:0.8rem; margin-top:10px; display:block;">Seja o primeiro a enviar uma mensagem!</span>`;
                return;
            }
            container.innerHTML = '';
            chat.forEach(m => {
                const div = document.createElement('div');
                div.className = 'chat-msg';
                div.innerHTML = `<b>${m.nome}</b> ${m.texto}`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
